name: Unify portfolio theme
on:
  push:
    paths:
      - '.github/workflows/unify-portfolio-theme.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate dark theme across public pages
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          targets = [Path('projects/index.html'), Path('skills/index.html'), Path('contact/index.html')]
          targets += sorted(Path('projects').glob('*/index.html'))

          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = text.replace('<meta name="theme-color" content="#f4f1e9">', '<meta name="theme-color" content="#090a0c">')
              text = text.replace('<meta name="theme-color" content="#f4f1e9" />', '<meta name="theme-color" content="#090a0c">')
              if '/secondary-dark.css' not in text:
                  text = text.replace('<link rel="stylesheet" href="/styles.css">', '<link rel="stylesheet" href="/styles.css">\n  <link rel="stylesheet" href="/secondary-dark.css">')
              text = text.replace('>afnan rafid<span class="brand-dot">.</span></a>', '>Afnan Rafid<span class="brand-dot">.</span></a>')
              text = text.replace('Contact <span>05</span>', 'Contact <span>04</span>')

              if path.parent != Path('projects') or path.name != 'index.html':
                  text = re.sub(r'<a class="case-back" href="[^"]*">← All projects</a>', '<a class="case-back" href="/projects/">← All projects</a>', text)
                  text = text.replace('<a href="/#work">Work</a>', '<a href="/projects/">Projects</a>')
                  text = text.replace('<a href="/#work">← Back to selected work</a>', '<a href="/projects/">← Back to all projects</a>')
                  text = text.replace('<a class="back-top" href="/#contact">GET IN TOUCH ↗</a>', '<a class="back-top" href="/contact/">GET IN TOUCH ↗</a>')
              path.write_text(text, encoding='utf-8')

      - name: Make generators safe for the redesigned site
        shell: python
        run: |
          from pathlib import Path

          p = Path('scripts/generate-pages.mjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace("const modified = '2026-10-21';", "const modified = '2026-10-27';")
          text = text.replace("const profileModifiedAt = '2026-10-21T17:28:22Z';", "const profileModifiedAt = '2026-10-27T04:41:00Z';")
          text = text.replace('<meta name="theme-color" content="#f4f1e9">', '<meta name="theme-color" content="#090a0c">')
          text = text.replace('<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"></head>', '<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/secondary-dark.css"></head>')
          text = text.replace("{'@type':'ListItem', position:2, name:'Selected work', item:`${origin}/#work`}", "{'@type':'ListItem', position:2, name:'Projects', item:`${origin}/projects/`}")
          text = text.replace('<a class="case-back" href="/#work">← All projects</a>', '<a class="case-back" href="/projects/">← All projects</a>')
          text = text.replace('<a href="/#work">Work</a>', '<a href="/projects/">Projects</a>')
          text = text.replace('<a href="/#work">← Back to selected work</a>', '<a href="/projects/">← Back to all projects</a>')
          text = text.replace('<a class="back-top" href="/#contact">GET IN TOUCH ↗</a>', '<a class="back-top" href="/contact/">GET IN TOUCH ↗</a>')
          text = text.replace("\n// Keep dedicated navigation pages in sync with homepage content and metadata.\nawait import('./generate-section-pages.mjs');\n", "\n")
          p.write_text(text, encoding='utf-8')

          section_script = '''import { readFileSync, writeFileSync } from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');\nfor (const slug of ['projects', 'skills', 'contact']) {\n  const file = path.join(root, slug, 'index.html');\n  let html = readFileSync(file, 'utf8');\n  html = html\n    .replaceAll('<meta name="theme-color" content="#f4f1e9">', '<meta name="theme-color" content="#090a0c">')\n    .replaceAll('<meta name="theme-color" content="#f4f1e9" />', '<meta name="theme-color" content="#090a0c">')\n    .replaceAll('Contact <span>05</span>', 'Contact <span>04</span>')\n    .replaceAll('>afnan rafid<span class="brand-dot">.</span></a>', '>Afnan Rafid<span class="brand-dot">.</span></a>');\n  if (!html.includes('/secondary-dark.css')) {\n    html = html.replace('<link rel="stylesheet" href="/styles.css">', '<link rel="stylesheet" href="/styles.css">\\n  <link rel="stylesheet" href="/secondary-dark.css">');\n  }\n  writeFileSync(file, html);\n}\nconsole.log('Normalized dedicated Projects, Skills, and Contact pages for the unified dark portfolio theme.');\n'''
          Path('scripts/generate-section-pages.mjs').write_text(section_script, encoding='utf-8')

      - name: Update sitemap modification dates
        shell: python
        run: |
          from pathlib import Path
          p = Path('sitemap.xml')
          p.write_text(p.read_text(encoding='utf-8').replace('<lastmod>2026-10-21</lastmod>', '<lastmod>2026-10-27</lastmod>'), encoding='utf-8')

      - name: Validate site integrity
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check home-cinematic.js
          node --check scripts/generate-pages.mjs
          node --check scripts/generate-section-pages.mjs
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          root = Path('.')
          public = [Path('projects/index.html'), Path('skills/index.html'), Path('contact/index.html')] + sorted(Path('projects').glob('*/index.html'))
          errors = []
          for p in public:
              text = p.read_text(encoding='utf-8')
              if '/secondary-dark.css' not in text:
                  errors.append(f'{p}: missing dark theme stylesheet')
              if '#f4f1e9' in text and 'theme-color' in text:
                  errors.append(f'{p}: stale light theme-color')
              if 'Contact <span>05</span>' in text:
                  errors.append(f'{p}: stale nav numbering')
              if 'The headshot is here intentionally' in text:
                  errors.append(f'{p}: internal design commentary leaked')

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k in ('href','src') and v: self.links.append(v)

          html_files = [Path('index.html'), Path('resume/index.html')] + public
          for p in html_files:
              parser = LinkParser(); parser.feed(p.read_text(encoding='utf-8'))
              for raw in parser.links:
                  if raw.startswith(('http://','https://','mailto:','tel:','data:','#')): continue
                  path = urlsplit(raw).path
                  if not path.startswith('/'): continue
                  rel = path.lstrip('/')
                  if not rel: continue
                  candidate = root / rel
                  if path.endswith('/'):
                      candidate = candidate / 'index.html'
                  if not candidate.exists():
                      errors.append(f'{p}: missing internal target {raw}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(html_files)} public HTML pages and their internal assets/routes.')
          PY

      - name: Commit integration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/unify-portfolio-theme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify portfolio pages and fix site maintenance'
          git push
