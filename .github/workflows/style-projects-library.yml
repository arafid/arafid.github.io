name: Style full projects library

on:
  push:
    paths:
      - '.github/workflows/style-projects-library.yml'

permissions:
  contents: write

jobs:
  style-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align full Projects page with cinematic homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('projects/index.html')
          html = p.read_text()

          if '<body class="projects-library-page">' not in html:
              html = html.replace('<body>', '<body class="projects-library-page">', 1)

          needle = '<link rel="stylesheet" href="/secondary-dark.css">'
          addition = needle + '\n  <link rel="stylesheet" href="/projects-cinematic.css">'
          if '/projects-cinematic.css' not in html:
              if needle not in html:
                  raise SystemExit('secondary-dark stylesheet reference not found')
              html = html.replace(needle, addition, 1)

          # Make the project-library header language match the main site more closely.
          html = html.replace('Let’s connect <span aria-hidden="true">↗</span>', 'Contact <span aria-hidden="true">↗</span>', 1)

          p.write_text(html)
          PY

      - name: Validate Projects library integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('projects/index.html').read_text()
          css = Path('projects-cinematic.css').read_text()
          assert '<body class="projects-library-page">' in html
          assert '<link rel="stylesheet" href="/projects-cinematic.css">' in html
          for anchor in ['/#about','/#work','/#skills','/#contact']:
              assert anchor in html, anchor
          for selector in ['.projects-library-page .site-header', '.projects-library-page .project-grid', '.projects-library-page .project-card']:
              assert selector in css, selector
          print('Projects library is wired to the cinematic design layer.')
          PY
          node --check app.js

      - name: Commit styling and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/style-projects-library.yml
          git add projects/index.html
          git commit -m 'Align full Projects library with cinematic homepage'
          git push
