name: Add analytical proof sections

on:
  push:
    paths:
      - '.github/workflows/add-analysis-proof.yml'

permissions:
  contents: write

jobs:
  enrich-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add modeling and analytical artifacts
        shell: python
        run: |
          from pathlib import Path

          def patch(path, marker, addition):
              p = Path(path)
              text = p.read_text()
              if '/case-code.css' not in text:
                  text = text.replace('<link rel="stylesheet" href="/secondary-dark.css"></head>', '<link rel="stylesheet" href="/secondary-dark.css"><link rel="stylesheet" href="/case-code.css"></head>')
              if addition not in text:
                  if marker not in text:
                      raise SystemExit(f'Marker not found in {path}')
                  text = text.replace(marker, marker + '\n' + addition, 1)
              p.write_text(text)

          patch(
              'projects/aggregate-indicators/index.html',
              '<section><h2>THE MODELING WORK</h2><p>Modeled the selected U.S. household income distributions with polynomial, exponential, and piecewise functions. I evaluated fit through residual analysis, R² interpretation, and chi-squared testing, using GeoGebra for regression/model fitting and Excel for supporting calculations.</p></section>',
              '''<section class="tech-proof"><h2>MODELING LAB / ANALYTICAL PROOF</h2><p class="tech-proof-intro">The code-equivalent here is model selection: compare a global curve with local models, examine fit and residual behavior, then ask whether the model is interpretable for the part of the distribution that matters.</p><div class="data-flow" aria-label="Aggregate indicators modeling workflow"><div class="flow-step"><small>01 / Data</small><strong>Grouped household-income distribution</strong></div><div class="flow-step"><small>02 / Global fit</small><strong>Polynomial regression</strong></div><div class="flow-step"><small>03 / Local fit</small><strong>Quadratic + exponential models</strong></div><div class="flow-step"><small>04 / Evaluate</small><strong>Residuals, R², assumptions</strong></div></div><div class="artifact-grid"><div class="artifact-card"><small>Model 01</small><strong>Polynomial regression</strong><p>Used as a broad fit across the observed distribution, with residual error and R² considered when judging how well one curve summarized the shape.</p></div><div class="artifact-card"><small>Model 02</small><strong>Quadratic lower-range fit</strong><p>Used to describe the lower-income portion locally rather than forcing one global function to explain every part of the distribution.</p></div><div class="artifact-card"><small>Model 03</small><strong>Exponential upper-tail fit</strong><p>Used for the upper-income portion where the observed shape behaved differently from the lower range.</p></div><div class="artifact-card"><small>Model 04</small><strong>Piecewise approximation</strong><p>Combined the local quadratic and exponential descriptions around an observed cutoff; normalization and cutoff validation remained unresolved limitations.</p></div></div><div class="model-formula"><span class="muted">conceptual piecewise structure</span><br>f(x) = { q(x), x &lt; c<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; e(x), x ≥ c }</div><div class="code-explain"><b>Modeling lesson</b><p>A high overall fit statistic is not automatically the most useful model. Local fit, residual behavior, interpretability, normalization, and the question being asked all matter.</p></div><p class="artifact-note">The original GeoGebra/Excel working files are no longer available, so this portfolio does not invent coefficients or replacement fit statistics. The negative-binomial idea was considered but not completed, and the historical chi-square result is not presented as independently validated.</p><a class="proof-link" href="https://github.com/arafid/Aggregate-Indicators-Quantitative-Research/blob/main/docs/method-and-limitations.md" target="_blank" rel="noopener noreferrer">Review documented method &amp; limitations ↗</a></section>'''
          )

          patch(
              'projects/dhaka-rickshaw-economic-impact/index.html',
              '<section><h2>THE REGRESSION WORK</h2><p>The original analysis modeled monthly expenses as a function of monthly income and reported an R² of approximately 0.98, with the fitted equation <strong>Expenses = 0.71 × Income − 795.867</strong>. The useful takeaway is the direction of the relationship in this small historical series: as reported income fell, reported spending also fell.</p></section>',
              '''<section class="tech-proof"><h2>REGRESSION PROOF / FROM FIELD DATA TO MODEL</h2><p class="tech-proof-intro">The analytical artifact here is a small historical regression built from the monthly income/expense series reported in the original paper.</p><div class="data-flow" aria-label="Dhaka research regression workflow"><div class="flow-step"><small>01 / Collect</small><strong>90 primary interviews</strong></div><div class="flow-step"><small>02 / Summarize</small><strong>6 monthly aggregate observations</strong></div><div class="flow-step"><small>03 / Model</small><strong>Expenses as a function of income</strong></div><div class="flow-step"><small>04 / Interpret</small><strong>Direction, fit, and limitations</strong></div></div><div class="artifact-grid three"><div class="artifact-card"><small>Fitted relationship</small><div class="equation">Expenses = 0.71 × Income − 795.867</div><p>Reported equation from the original submission.</p></div><div class="artifact-card"><small>Reported fit</small><div class="metric">R² ≈ 0.98</div><p>Descriptive fit for the six-point monthly aggregate series.</p></div><div class="artifact-card"><small>Reported error</small><div class="metric">SE ≈ 64.4</div><p>Standard error reported in the historical analysis.</p></div></div><div class="code-explain"><b>Analytical takeaway</b><p>The model captured a strong positive relationship in this small series: lower reported income was associated with lower reported spending. The useful skill is not just fitting the line, but qualifying what the line can and cannot support.</p></div><p class="artifact-note">This is not a causal or predictive model. The regression uses only six monthly aggregate observations, and the underlying financial values were self-reported.</p><a class="proof-link" href="https://github.com/arafid/Dhaka-Rickshaw-Economic-Impact-Research/blob/main/data/monthly-income-expenses.csv" target="_blank" rel="noopener noreferrer">View the preserved regression series ↗</a></section>'''
          )

          patch(
              'projects/equifax-cyber-risk-assessment/index.html',
              '<section><h2>THE FOUR SCENARIOS</h2><ul><li>Sensitive data compromise or manipulation.</li><li>Critical decision-service disruption.</li><li>Trusted third-party or partner compromise.</li><li>AI-agent or machine-identity misuse.</li></ul></section>',
              '''<section class="tech-proof"><h2>RISK FORECAST MODEL / STRUCTURED UNCERTAINTY</h2><p class="tech-proof-intro">The technical artifact here is a scenario-based forecasting structure: combine outside-in threat evidence with Equifax-specific exposure, existing controls, business impact, and assumptions to produce planning ranges rather than false precision.</p><div class="data-flow" aria-label="Equifax cyber risk forecasting workflow"><div class="flow-step"><small>01 / Evidence</small><strong>External threat patterns</strong></div><div class="flow-step"><small>02 / Context</small><strong>Exposure, controls, dependencies</strong></div><div class="flow-step"><small>03 / Forecast</small><strong>12-month planning range</strong></div><div class="flow-step"><small>04 / Action</small><strong>Control priority + roadmap</strong></div></div><div class="artifact-grid"><div class="artifact-card"><div class="risk-range"><strong>Sensitive data compromise</strong><span>5–15%</span></div><p>Data sensitivity and exploitation risk balanced against security maturity, detection, and cloud-native controls.</p></div><div class="artifact-card"><div class="risk-range"><strong>Decision-service disruption</strong><span>8–20%</span></div><p>Ransomware/disruption exposure balanced against cloud resilience, recovery, and failover practices.</p></div><div class="artifact-card"><div class="risk-range"><strong>Third-party compromise</strong><span>12–30%</span></div><p>Broad partner dependency surface with risk that cannot be fully controlled internally.</p></div><div class="artifact-card"><div class="risk-range"><strong>AI / machine-identity misuse</strong><span>10–25%</span></div><p>Growing automation exposure with guardrails, human oversight, and governance still maturing.</p></div></div><div class="code-explain"><b>Forecasting lesson</b><p>Ranges are more honest than a single-point probability when evidence is uncertain. The value is in making assumptions explicit and connecting the forecast to concrete controls and owners.</p></div><p class="artifact-note">These are team-developed academic planning estimates, not published Equifax incident rates or outputs from an internal Equifax risk model.</p><a class="proof-link" href="https://github.com/arafid/Equifax-Cybersecurity-Risk-Assessment/blob/main/docs/Cybersecurity_Strategy_Report.md" target="_blank" rel="noopener noreferrer">View forecast rationale and roadmap ↗</a></section>'''
          )

          patch(
              'projects/taco-truck-project-management/index.html',
              '<section><h2>FROM REQUIREMENTS TO A PROJECT PLAN</h2><p>The team built the work across three milestones. The first established scope, requirements, phases, task dependencies, a Gantt-style schedule, a critical path, and initial app mockups. The second added cost and procurement planning, a risk register, measurable quality criteria, testing approaches, accessibility and payment-security considerations, and updated mockups. The final milestone added stakeholder analysis, a communication register, change control, final screen concepts, and a project closeout plan.</p></section>',
              '''<section class="tech-proof"><h2>PROJECT CONTROL / TECHNICAL PLANNING PROOF</h2><p class="tech-proof-intro">The code-equivalent for this project is the control system behind the proposed build: dependency logic, critical path, risk planning, measurable quality thresholds, testing, and change control.</p><div class="data-flow" aria-label="Mobile app project planning workflow"><div class="flow-step"><small>01 / Scope</small><strong>Requirements + stakeholders</strong></div><div class="flow-step"><small>02 / Sequence</small><strong>Dependencies + critical path</strong></div><div class="flow-step"><small>03 / Control</small><strong>Risk, quality, testing</strong></div><div class="flow-step"><small>04 / Deliver</small><strong>Launch, handoff, closeout</strong></div></div><div class="artifact-grid"><div class="artifact-card"><small>Critical path</small><strong>Requirements → Design → Core Development → Testing → Deployment</strong><p>The schedule explicitly linked predecessor work so downstream testing and launch depended on completed core functionality.</p></div><div class="artifact-card"><small>Risk register</small><div class="metric">10 risks</div><p>Scope creep, app-store rejection, third-party downtime, budget, compatibility, security, staffing, adoption, testing, and compliance.</p></div><div class="artifact-card"><small>Quality thresholds</small><strong>&lt;2s load · &gt;99.9% crash-free · ≥85% usability</strong><p>Planning targets were paired with accessibility and payment-security requirements.</p></div><div class="artifact-card"><small>Testing architecture</small><strong>Unit → Integration → Regression → UAT</strong><p>Also included accessibility, performance, cross-platform, and automated testing in the planned QA approach.</p></div></div><div class="code-explain"><b>Systems-thinking lesson</b><p>A technical project is more than feature development. Dependencies, acceptance criteria, risk ownership, testing, and change control determine whether the work can move from an idea to a controlled delivery process.</p></div><p class="artifact-note">These are academic planning artifacts for a proposed app, not production performance results or a deployed software system.</p><a class="proof-link" href="https://github.com/arafid/arafid.github.io/blob/main/projects/taco-truck-project-management/artifacts.md" target="_blank" rel="noopener noreferrer">Review cleaned planning artifacts ↗</a></section>'''
          )

          patch(
              'projects/paypal-strategic-analysis/index.html',
              '<section><h2>THE QUESTION</h2><p>How can a payments platform turn its scale, data, customer relationships, and merchant network into a more defensible advantage? The analysis connected external competitive pressure with internal resources and execution challenges.</p></section>',
              '''<section class="tech-proof"><h2>STRATEGY MODEL / EVIDENCE TO RECOMMENDATION</h2><p class="tech-proof-intro">This project’s analytical equivalent is a structured strategy stack: use external-market frameworks to identify pressure, test internal resources for defensibility, then connect the evidence to recommendations and downside risks.</p><div class="data-flow" aria-label="PayPal strategy analysis workflow"><div class="flow-step"><small>01 / Market</small><strong>SWOT + Five Forces</strong></div><div class="flow-step"><small>02 / Capability</small><strong>VRIN resource test</strong></div><div class="flow-step"><small>03 / Choice</small><strong>Innovation + POS options</strong></div><div class="flow-step"><small>04 / Stress test</small><strong>Competition, tech, regulation</strong></div></div><div class="artifact-grid"><div class="artifact-card"><small>External pressure</small><strong>Rivalry + buyer power</strong><p>Low switching friction and strong alternatives made checkout competition and customer choice central strategic pressures.</p></div><div class="artifact-card"><small>VRIN insight</small><strong>Data behind fraud detection</strong><p>The AI model itself was not treated as uniquely defensible; transaction history and data scale were the harder-to-replicate resource.</p></div><div class="artifact-card"><small>Strategic option 01</small><strong>Strengthen organic innovation</strong><p>Reduce reliance on acquisition-led growth and improve integration of existing capabilities.</p></div><div class="artifact-card"><small>Strategic option 02</small><strong>Expand in-person commerce</strong><p>Use merchant infrastructure, buyer accounts, BNPL, rewards, and transaction data to connect online and physical payments.</p></div></div><div class="code-explain"><b>Analysis lesson</b><p>Frameworks matter only when they change the decision. Here, external pressure and resource defensibility were translated into concrete strategic options, then stress-tested against POS entrenchment, AI-driven commerce, and BNPL regulation.</p></div><a class="proof-link" href="https://github.com/arafid/PayPal-Strategic-Analysis/blob/main/docs/PayPal_Strategic_Case_Study.md" target="_blank" rel="noopener noreferrer">Review executive strategy case ↗</a></section>'''
          )
      - name: Validate changes
        run: |
          grep -q 'MODELING LAB / ANALYTICAL PROOF' projects/aggregate-indicators/index.html
          grep -q 'REGRESSION PROOF / FROM FIELD DATA TO MODEL' projects/dhaka-rickshaw-economic-impact/index.html
          grep -q 'RISK FORECAST MODEL / STRUCTURED UNCERTAINTY' projects/equifax-cyber-risk-assessment/index.html
          grep -q 'PROJECT CONTROL / TECHNICAL PLANNING PROOF' projects/taco-truck-project-management/index.html
          grep -q 'STRATEGY MODEL / EVIDENCE TO RECOMMENDATION' projects/paypal-strategic-analysis/index.html
          for f in projects/aggregate-indicators/index.html projects/dhaka-rickshaw-economic-impact/index.html projects/equifax-cyber-risk-assessment/index.html projects/taco-truck-project-management/index.html projects/paypal-strategic-analysis/index.html; do grep -q '/case-code.css' "$f"; done
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/aggregate-indicators/index.html projects/dhaka-rickshaw-economic-impact/index.html projects/equifax-cyber-risk-assessment/index.html projects/taco-truck-project-management/index.html projects/paypal-strategic-analysis/index.html
          git rm .github/workflows/add-analysis-proof.yml
          git commit -m 'Add analytical proof to remaining project cases'
          git push