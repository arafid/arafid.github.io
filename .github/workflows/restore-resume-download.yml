name: Restore resume PDF download links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore direct PDF download UX
        shell: python
        run: |
          from pathlib import Path

          home = Path('index.html')
          text = home.read_text()
          old = '<a class="text-link" href="/resume/">View résumé <span aria-hidden="true">↗</span></a>'
          new = '<a class="text-link" href="/assets/Afnan_Rafid_Resume.pdf" download>Download résumé <span aria-hidden="true">↓</span></a>'
          if old not in text:
              raise SystemExit('Homepage resume CTA pattern not found')
          home.write_text(text.replace(old, new, 1))

          page = Path('resume/index.html')
          text = page.read_text()
          old = '<body><nav class="resume-toolbar" aria-label="Résumé actions"><a href="/">← Back to portfolio</a><button id="print-resume" type="button">Print / Save as PDF ↗</button></nav>'
          new = '<body><nav class="resume-toolbar" aria-label="Résumé actions"><a href="/">← Back to portfolio</a><a class="resume-download" href="/assets/Afnan_Rafid_Resume.pdf" download>Download PDF ↓</a><button id="print-resume" type="button">Print / Save as PDF ↗</button></nav>'
          if old not in text:
              raise SystemExit('Online resume toolbar pattern not found')
          page.write_text(text.replace(old, new, 1))
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-resume-download.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link portfolio to current resume PDF"
          git push
