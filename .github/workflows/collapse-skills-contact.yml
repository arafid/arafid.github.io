name: Collapse Skills and Contact into main portfolio

on:
  push:
    paths:
      - '.github/workflows/collapse-skills-contact.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove secondary Skills and Contact shells
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Route every internal Skills/Contact link back to the main cinematic homepage.
          for path in Path('.').rglob('*.html'):
              text = path.read_text()
              text = text.replace('href="/skills/"', 'href="/#skills"')
              text = text.replace('href="/contact/"', 'href="/#contact"')
              path.write_text(text)

          # The homepage no longer advertises a separate Skills shell.
          home = Path('index.html')
          text = home.read_text()
          text = text.replace(
              '<a class="button button-ghost" href="/#skills">Full skills page ↗</a>',
              '<a class="button button-ghost" href="#work">See these skills in action ↗</a>'
          )
          home.write_text(text)

          def redirect_page(target, label):
              return f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#090a0c">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0; url=/{target}">
            <link rel="canonical" href="https://arafid.github.io/">
            <title>{label} | Afnan Rafid</title>
            <script>window.location.replace('/{target}');</script>
            <style>
              html,body{{margin:0;min-height:100%;background:#090a0c;color:#f5f2ea;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}}
              body{{display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}}
              main{{max-width:620px;text-align:center}}
              a{{color:#ff875c}}
            </style>
          </head>
          <body><main><p>Taking you to <a href="/{target}">{label} on the main portfolio</a>…</p></main></body>
          </html>\n'''

          Path('skills/index.html').write_text(redirect_page('#skills', 'Skills'))
          Path('contact/index.html').write_text(redirect_page('#contact', 'Contact'))

          sitemap = Path('sitemap.xml')
          lines = sitemap.read_text().splitlines()
          lines = [line for line in lines if 'https://arafid.github.io/skills/' not in line and 'https://arafid.github.io/contact/' not in line]
          sitemap.write_text('\n'.join(lines) + '\n')

          generator = Path('scripts/generate-section-pages.mjs')
          g = generator.read_text()
          g = g.replace("for (const slug of ['projects', 'skills', 'contact']) {", "for (const slug of ['projects']) {")
          g = g.replace('Normalized dedicated Projects, Skills, and Contact pages for the unified dark portfolio theme.', 'Normalized the dedicated Projects page; Skills and Contact live on the main portfolio.')
          generator.write_text(g)
          PY

      - name: Validate navigation architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('index.html').read_text()
          assert 'href="#skills"' in home
          assert 'href="#contact"' in home
          assert 'See these skills in action' in home
          assert 'Full skills page' not in home

          skills = Path('skills/index.html').read_text()
          contact = Path('contact/index.html').read_text()
          assert "window.location.replace('/#skills')" in skills
          assert "window.location.replace('/#contact')" in contact

          bad = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text()
              if 'href="/skills/"' in text or 'href="/contact/"' in text:
                  bad.append(str(path))
          assert not bad, f'Stale secondary entry links remain: {bad}'

          sitemap = Path('sitemap.xml').read_text()
          assert 'https://arafid.github.io/skills/' not in sitemap
          assert 'https://arafid.github.io/contact/' not in sitemap
          print('Skills and Contact are now homepage-only primary destinations; legacy routes redirect safely.')
          PY
          node --check home-cinematic.js
          node --check app.js
          node --check scripts/generate-section-pages.mjs

      - name: Commit architecture cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/collapse-skills-contact.yml
          git add -A
          git commit -m 'Keep Skills and Contact in main portfolio experience'
          git push
