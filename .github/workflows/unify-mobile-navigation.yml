name: Unify mobile navigation

on:
  push:
    paths:
      - '.github/workflows/unify-mobile-navigation.yml'

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation repair
        run: python3 scripts/fix-primary-nav.py
      - name: Validate scripts
        run: |
          node --check app.js
          node --check scripts/generate-section-pages.mjs
      - name: Commit navigation repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/unify-mobile-navigation.yml scripts/fix-primary-nav.py
          git add index.html projects/index.html skills/index.html contact/index.html scripts/generate-section-pages.mjs
          git commit -m 'Unify primary navigation around homepage sections'
          git push
