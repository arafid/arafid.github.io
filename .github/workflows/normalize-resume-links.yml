name: Normalize resume links

on:
  push:
    paths:
      - '.maintenance/READY'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point resume CTAs to current online resume
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              '<a class="text-link" href="/assets/Afnan_Rafid_Resume.pdf" download>Download résumé <span aria-hidden="true">↓</span></a>': '<a class="text-link" href="/resume/">View résumé <span aria-hidden="true">↗</span></a>',
              '<a class="case-resume" href="/assets/Afnan_Rafid_Resume.pdf" download>Résumé ↓</a>': '<a class="case-resume" href="/resume/">Résumé ↗</a>',
              '<a class="resume-download" href="/assets/Afnan_Rafid_Resume.pdf" download>Download PDF ↓</a>': ''
          }
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
      - name: Commit link updates and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -r .maintenance .github/workflows/normalize-resume-links.yml
          git commit -m "Route resume links to current online resume"
          git push
